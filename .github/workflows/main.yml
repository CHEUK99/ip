name: Auto Scraper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install requests
      - run: python run.py
      - name: Commit result
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add ip_list.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update IP list" && git push)
